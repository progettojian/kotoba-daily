<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive"><style>html{color-scheme:light}body{margin:0}</style></head><body><title>Kotoba Daily</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+JP:wght@500;700&family=Noto+Serif+KR:wght@500;700&display=swap">
<style>
/* Layout concept: interpreter's top-bound note pad. Quiet paper ground, one teal ink,
   language colors (JA vermilion / KO blue) used only on small chips, timer is the one loud element. */
:root{
  --bg:#F3F5F2;--surface:#FFFFFF;--surface2:#E8EDE9;--fg:#17262A;--muted:#566669;--line:#D2DAD5;
  --accent:#0E6B63;--accent-fg:#FFFFFF;--accent-soft:#D4EAE5;
  --ja:#A63428;--ja-soft:#F5DDD9;--ko:#2A5A99;--ko-soft:#DBE6F4;
  --ok:#2B7A3E;--warn:#A9710F;--bad:#BE3B2D;--pen:#17262A;
  --sans:'Noto Sans KR','Noto Sans JP',system-ui,-apple-system,'Apple SD Gothic Neo','Hiragino Sans',sans-serif;
  --serif:'Noto Serif KR','Noto Serif JP','Apple SD Gothic Neo','Hiragino Mincho ProN',serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1A1C;--surface:#162427;--surface2:#1D2F32;--fg:#E6EFEC;--muted:#93A8A8;--line:#2A3E41;
  --accent:#4FC4B3;--accent-fg:#06211E;--accent-soft:#17403C;
  --ja:#F08A7D;--ja-soft:#3B1F1C;--ko:#8DB6EE;--ko-soft:#1B2D45;
  --ok:#6FCB84;--warn:#E5B454;--bad:#F08A7D;--pen:#E6EFEC;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1A1C;--surface:#162427;--surface2:#1D2F32;--fg:#E6EFEC;--muted:#93A8A8;--line:#2A3E41;
  --accent:#4FC4B3;--accent-fg:#06211E;--accent-soft:#17403C;
  --ja:#F08A7D;--ja-soft:#3B1F1C;--ko:#8DB6EE;--ko-soft:#1B2D45;
  --ok:#6FCB84;--warn:#E5B454;--bad:#F08A7D;--pen:#E6EFEC;color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:14px 104px;-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto}
.stack{display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--serif);font-size:26px;line-height:1.2;margin:0;font-weight:700;letter-spacing:-.01em}
h2{font-size:15px;margin:0;font-weight:700}
h3{font-size:13px;margin:0;font-weight:700;color:var(--muted);letter-spacing:.04em}
p{margin:0}
.sub{color:var(--muted);font-size:13px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding-top:4px}

button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:10px;
  border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg);font-weight:700;font-size:15px}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.sm{min-height:38px;padding:0 14px;font-size:14px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:default}
.link{background:none;border:0;color:var(--accent);padding:8px 0;min-height:40px;font-weight:500}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.card.plain{background:transparent;border:0;padding:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stats>div{padding:12px 4px;text-align:center}
.stats>div+div{border-left:1px solid var(--line)}
.stats b{display:block;font-family:var(--mono);font-size:22px;font-weight:500;line-height:1.2}
.stats span{font-size:12px;color:var(--muted)}
.bar{height:6px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar>span{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}

.chip{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;letter-spacing:.02em}
.chip.ja{background:var(--ja-soft);color:var(--ja)}
.chip.ko{background:var(--ko-soft);color:var(--ko)}
.tag{font-size:12px;color:var(--muted);padding:1px 0}
.tag.ok{color:var(--ok);font-weight:700}
.tag.warn{color:var(--warn);font-weight:700}

.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row-main{min-width:0;flex:1}
.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.hidden-text{color:var(--muted);font-size:14px}
.is-done .hidden-text{display:none}
.sent{font-family:var(--serif);font-size:20px;line-height:1.65;overflow-wrap:anywhere}
.sent.sm{font-size:16px;line-height:1.55}
.sent[lang=ja]{font-family:'Noto Serif JP','Noto Serif KR','Hiragino Mincho ProN',serif}
.sent[lang=ko]{font-family:'Noto Serif KR','Noto Serif JP','Apple SD Gothic Neo',serif}
.section-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabs-in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.tab{background:none;border:0;border-radius:8px;min-height:48px;font-size:12px;padding:0 2px;white-space:nowrap;font-weight:500;color:var(--muted);position:relative}
.tab[aria-current=page]{color:var(--accent);font-weight:700}
.tab[aria-current=page]::before{content:"";position:absolute;top:-7px;left:25%;right:25%;height:3px;background:var(--accent);border-radius:0 0 3px 3px}

/* practice */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;list-style:none;padding:0;margin:0}
.steps li{font-size:12px;text-align:center;padding:6px 0;border-bottom:3px solid var(--line);color:var(--muted)}
.steps li.on{border-color:var(--accent);color:var(--accent);font-weight:700}
.steps li.done{border-color:var(--accent);opacity:.55}
.pbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pbar .meta{margin:0}
.listen{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center}
.play{width:78px;height:78px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center}
.play[aria-busy=true]{background:var(--accent-soft);color:var(--accent)}
.play svg,.mic svg{width:32px;height:32px}
.ctrl{display:flex;gap:8px;flex-wrap:wrap}
.timer{position:relative;width:118px;height:118px;flex:none}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer circle{fill:none;stroke-width:9}
.timer .trk{stroke:var(--surface2)}
.timer .arc{stroke:var(--ok);stroke-linecap:round;transition:stroke .2s}
.timer.warn .arc{stroke:var(--warn)}.timer.bad .arc{stroke:var(--bad)}.timer.idle .arc{stroke:var(--line)}
.timer .tv{position:absolute;inset:0;display:grid;place-content:center;text-align:center;font-family:var(--mono);font-size:30px;font-weight:500;line-height:1}
.timer .tv small{display:block;font-size:11px;color:var(--muted);margin-top:6px;font-family:var(--sans)}
.timer.bad .tv{color:var(--bad)}
.hint{margin-top:12px;padding:12px;border-radius:8px;background:var(--surface2)}
.pad{border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.pad-bar{display:flex;justify-content:space-between;align-items:center;padding:6px 8px 6px 12px;border-bottom:1px solid var(--line);gap:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:transparent;border:0;padding:0 12px;min-height:34px;font-size:13px;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-fg);font-weight:700}
.sheet{position:relative;height:176px;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 27px,var(--line) 27px,var(--line) 28px)}
.sheet::before{content:"";position:absolute;top:0;bottom:0;left:34%;width:1px;background:var(--accent);opacity:.45;pointer-events:none}
.sheet canvas,.sheet textarea{position:absolute;inset:0;width:100%;height:100%;display:block}
.sheet canvas{touch-action:none}
.sheet textarea{border:0;background:transparent;resize:none;padding:0 10px;line-height:28px;font:16px/28px var(--sans);color:var(--fg)}
.speak{display:flex;flex-direction:column;gap:12px;align-items:stretch}
.speak-top{display:flex;align-items:center;gap:16px}
.mic{width:84px;height:84px;flex:none;border-radius:50%;border:0;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center}
.mic.rec{background:var(--bad);color:#fff;animation:pulse 1.3s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(190,59,45,.4)}50%{box-shadow:0 0 0 12px rgba(190,59,45,0)}}
@media (prefers-reduced-motion:reduce){.mic.rec{animation:none}.bar>span,.timer .arc{transition:none}}
.status{font-size:14px}
.help{font-size:13px;color:var(--muted)}
.help.warn{color:var(--warn)}
textarea.field,input.field,select.field{width:100%;font:16px/1.55 var(--sans);color:var(--fg);background:var(--surface);
  border:1px solid var(--line);border-radius:8px;padding:10px 12px}
textarea.field{min-height:84px;resize:vertical}
select.field{min-height:44px}
audio{width:100%;height:40px}
.cmp{display:flex;flex-direction:column;gap:14px}
.cmp-block{display:flex;flex-direction:column;gap:6px}
.cmp-block .lab{display:flex;justify-content:space-between;align-items:center;gap:8px}
.cmp-block.mine .sent{color:var(--fg)}
.cmp-block.model{padding:14px;border-radius:10px;background:var(--accent-soft)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:13px;padding:3px 10px;border-radius:99px;border:1px solid var(--line)}
.pill.hit{border-color:var(--ok);color:var(--ok)}
.pill.miss{border-color:var(--bad);color:var(--bad)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv dt{font-weight:700}.kv dd{margin:0;color:var(--muted)}
.key{display:flex;flex-direction:column;gap:6px}
.key b{font-family:var(--serif);font-size:16px;margin-right:6px}
.eval{display:grid;grid-template-columns:90px 1fr;gap:8px;align-items:center;font-size:14px}
.chk{display:flex;gap:10px;align-items:center;font-size:14px}
.chk input{width:20px;height:20px;accent-color:var(--accent)}
.foot{display:flex;gap:10px;flex-wrap:wrap}
.foot .btn{flex:1;min-width:140px}

/* library */
.filters{display:flex;gap:8px;flex-wrap:wrap}
.fbtn{min-height:36px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:transparent;font-size:13px}
.fbtn[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:700}
.strip{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}
.strip i{display:block;aspect-ratio:1;border-radius:4px;background:var(--surface2)}
.strip i.l1{background:var(--accent-soft)}
.strip i.l2{background:var(--accent);opacity:.6}
.strip i.l3{background:var(--accent)}
details.lib{border-bottom:1px solid var(--line)}
details.lib summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:14px 0;min-height:48px}
details.lib summary::-webkit-details-marker{display:none}
details.lib[open] summary{padding-bottom:8px}
.lib-body{display:flex;flex-direction:column;gap:12px;padding:0 0 16px}
.att{font-size:13px;color:var(--muted)}
.att div{padding:2px 0}

.empty{padding:28px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;
  max-width:min(92vw,520px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;text-align:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}.listen{grid-template-columns:1fr;justify-items:start}}
label.lb{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:var(--muted)}
label.lb .field{font-weight:400}
.diag{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14px}
.diag b.ok{color:var(--ok)}.diag b.no{color:var(--bad)}
pre.out{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;margin:0}
.step{display:flex;gap:12px;align-items:flex-start}
.num{width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-size:13px;font-weight:700;flex:none;margin-top:1px}
.gram{display:flex;flex-direction:column;gap:14px}
.gram b{display:block;font-size:15px;margin-bottom:2px}
.gram p{color:var(--muted);font-size:14px}
.ai-out{white-space:pre-wrap;overflow-wrap:anywhere;padding:14px;border-radius:10px;background:var(--surface2);font-size:14px;line-height:1.7}
.dx{font-weight:700;text-decoration:underline wavy var(--warn);text-decoration-thickness:1.5px;text-underline-offset:5px}
details>summary{min-height:32px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tchip{font:inherit;font-size:13px;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:transparent;color:inherit;cursor:pointer;min-height:36px}
.tchip.on{background:var(--accent);color:var(--accent-fg);border-color:transparent}
</style>

<div id="app" class="wrap"></div>
<nav id="tabs" class="tabs" aria-label="주요 메뉴"><div class="tabs-in" id="tabs-in"></div></nav>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script>
(function(){
'use strict';

/* ---------- 문장 은행 (일→한 / 한→일 번갈아) ---------- */
/* key:[표현,설명]  must:[라벨,[정답에 들어가면 좋은 표현...]]  */
const BANK=[
{id:'b01',lang:'ja',src:'来週の水曜日までに、見積書をいただけますでしょうか。',ref:'다음 주 수요일까지 견적서를 보내 주실 수 있을까요?',
 key:[['〜までに','기한을 나타냅니다. 계속을 뜻하는 「まで」와 구분하세요. “수요일까지(그 안에)”'],['いただけますでしょうか','「いただけますか」보다 한 단계 더 공손한 의뢰']],
 nuance:'일본어는 의뢰를 질문형으로 부드럽게 말합니다. 한국어도 “보내 주세요”보다 “보내 주실 수 있을까요?”로 옮겨야 톤이 맞습니다.',
 yomi:'来週(らいしゅう) 水曜日(すいようび) 見積書(みつもりしょ)',

{id:'b02',lang:'ko',src:'공사 일정이 이틀 정도 늦어질 것 같습니다.',ref:'工事のスケジュールが二日ほど遅れそうです。',
 key:[['〜そうです','눈앞의 상황에서 본 전망(様態). “늦어질 것 같다”'],['二日ほど','「ほど」로 대략의 수량을 완곡하게 표현']],
 nuance:'본사·상사 보고라면 「遅れる見込みです」가 더 비즈니스다운 표현입니다.',
 yomi:'工事(こうじ) 二日(ふつか) 遅(おく)れそうです',
 must:[['공사',['工事']],['이틀',['二日','2日','ふつか']],['지연',['遅']]]},
{id:'b03',lang:'ja',src:'納期については、改めてご連絡いたします。',ref:'납기에 대해서는 다시 연락드리겠습니다.',

 must:[['납기',['납기','납품 기한','납품기한']],['다시/추후',['다시','추후','나중에','별도로']],['연락',['연락']]]},
{id:'b04',lang:'ko',src:'죄송하지만 오늘 중으로 확인 부탁드립니다.',ref:'恐れ入りますが、本日中にご確認をお願いいたします。',

{id:'b06',lang:'ko',src:'저희 쪽에서 먼저 확인해 보고 말씀드리겠습니다.',ref:'こちらでまず確認してから、ご連絡いたします。',
 key:[['こちら','“저희 쪽”. 사외 상대에게는 「弊社」도 가능'],['確認してから','“확인한 뒤에”. 순서를 분명히']],
 nuance:'“말씀드리겠습니다”를 「お話しします」로 옮기면 어색합니다. 업무에서는 「ご連絡」「ご報告」가 자연스럽습니다. 언제까지 답할지 덧붙이면 신뢰를 줍니다.',
 yomi:'確認(かくにん) 連絡(れんらく)',

b12:[['〜ておりまして','이유를 부드럽게 말하고 뒤로 이어 가는 「〜ていて」의 겸양형입니다. 말끝을 완곡하게 이어서 거절을 누그러뜨립니다.'],['〜状況です','단정을 피하고 지금의 상황을 설명하는 표현입니다. 「難しいです」보다 객관적이고 부드럽게 들립니다.']],
b13:[['〜の際に','「〜とき」의 격식 표현입니다. 문서와 안내문에서 많이 씁니다.'],['ご+한자어+ください','존경형 요청입니다. ご確認ください. 순일본어 동사는 「お+ます형+ください」(お待ちください)로 짝을 이룹니다.']],
b14:[['〜で(방식·상태)','「税込みで表示する」의 「で」는 방식이나 상태를 나타냅니다. “세금 포함 방식으로”.'],['〜ております','「ている」의 겸양 정중형으로 현재 상태나 습관을 말합니다. 자기 쪽 행동에만 씁니다.']],
b15:[['〜のある+명사','「アレルギーのあるお客様」에서 「ある」가 명사를 꾸밉니다. 수식절 안에서는 「が」가 「の」로 바뀔 수 있습니다.'],['お+동사 ます형+ください','「お知らせください」는 존경 요청 패턴입니다. 「知らせる」의 ます형 「知らせ」에 「お」를 붙입니다.']],
b16:[['〜のため(이유)','명사+「のため」는 객관적이고 격식 있는 이유 표현입니다. 공지와 안내에 적합하고, 「〜ので」는 구어적이고 부드럽습니다.'],['遅れる(자동사)와 遅らせる(타동사)','「営業開始が遅れます」는 시작 시각이 늦어진다는 변화를 말합니다. 사람이 일부러 늦출 때는 「遅らせます」를 씁니다.']],
b17:[['〜比(대비)','「前年同月比」는 “전년 동월 대비”로, 보고서 문체에서 쓰는 표현입니다. 뒤에 「+○%」나 「で」가 이어집니다.'],['割(わり)의 단위','「一割」=10%, 「二割」=20%, 「三割」=30%입니다. 割는 10%를 한 단위로 세는 말이라 숫자 환산에 주의하세요.']],
b18:[['〜たうえで','동사 た형 뒤에 うえで가 붙으면 앞의 일을 마친 뒤 그 결과를 토대로 한다는 뜻입니다. 「〜てから」보다 신중하고 문서적입니다.'],['ご報告いたします','상사나 본사에게 쓰는 겸양입니다. 「報告します」보다 「ご報告いたします」가 관계에 맞습니다.']],
b19:[['〜次第','동사 ます형에 次第가 붙으면 “~하는 대로 곧바로”입니다. 「〜たら」보다 즉시성과 순서가 분명합니다. 뒤에는 의지나 결과를 나타내는 말이 옵니다.'],['〜となります','「〜になります」보다 정중하고 객관적인 안내 표현입니다. 결과나 상태를 통지할 때 씁니다.']],
b20:[['〜場合は','「発生する場合は」처럼 “~하는 경우에는”이라는 조건입니다. 「〜たら」보다 객관적이고, 보통 동사 기본형 뒤에 붙습니다.'],['〜いたします와 〜させていただきます','「ご相談いたします」는 자기 행동을 낮추는 겸양입니다. 「させていただきます」에는 허락과 은혜의 뉘앙스가 있어, 단순한 통지에는 「いたします」가 간결합니다.']],
b21:[['〜いただけますか','「〜ていただく」의 가능형 의문으로, 「〜てください」보다 부드러운 의뢰입니다. 한국어는 “~해 주시겠습니까?”.'],['念のため','문장 앞에 놓이는 관용 표현입니다. “확인 차”라는 쿠션 역할을 해서 상대를 의심하는 느낌을 줄여 줍니다.']],
b22:[['伺う(겸양어)','「行く・訪問する」의 겸양어로, 내가 상대를 방문할 때 씁니다. 상대가 오는 경우에는 「お越しになる」「いらっしゃる」를 씁니다.'],['〜予定です','확정된 계획과 일정입니다. 「〜つもりです」는 의지, 「〜予定です」는 이미 잡힌 일정이라는 점이 다릅니다.']],
b23:[['できる限り','뒤에 의지나 노력의 표현이 이어져 “가능한 한”이 됩니다. 약속이 아니라 노력의 범위를 나타냅니다.'],['〜よう(목적)','「沿えるよう努めます」의 「よう」는 동사 기본형 뒤에서 목적이나 방향을 나타내는 “~하도록”입니다. 「ように」의 줄임 형태입니다.']],
b24:[['〜た+명사(과거 수식)','「決まった内容」처럼 과거형이 명사를 꾸미면 이미 일어난 결과를 가리킵니다. “정해진 내용”.'],['共有いたします','한자어+いたす의 겸양 표현입니다. 「共有させていただきます」보다 간결하고, 허락을 구하는 느낌이 없습니다.']]
};

function h(tag,attrs){
  const el=document.createElement(tag);
  if(attrs)for(const k in attrs){const v=attrs[k];if(v==null||v===false)continue;
    if(k==='class')el.className=v;else if(k==='text')el.textContent=v;
    else if(k.slice(0,2)==='on'&&typeof v==='function')el.addEventListener(k.slice(2),v);
    else if(v===true)el.setAttribute(k,'');else el.setAttribute(k,v);}
  for(let i=2;i<arguments.length;i++){const c=arguments[i];
    (Array.isArray(c)?c:[c]).forEach(x=>{if(x==null||x===false)return;el.append(x.nodeType?x:document.createTextNode(String(x)));});}
  return el;
}

function lastNewLang(){
  const ds=Object.keys(S.days).sort();
  for(let i=ds.length-1;i>=0;i--){const n=S.days[ds[i]].newIds;if(n&&n.length){const s=byId(n[n.length-1]);if(s)return s.lang;}}
  return null;
}
let lastFell=false;
function pickNew(n,start){
  const t=todayStr(),pool={ja:[],ko:[]},rest={ja:[],ko:[]};
  const sel=(S.settings.topics||[]).filter(x=>TOPICS.includes(x));
  lastFell=false;
  S.custom.concat(BANK).forEach(s=>{const p=S.progress[s.id];if(p&&p.introDay)return;
    ((!sel.length||!s.topic||sel.includes(s.topic))?pool:rest)[s.lang].push(s);});
  const out=[];let want=start;
  for(let i=0;i<n;i++){
    let s=pool[want].shift();
    if(!s){s=pool[other(want)].shift();if(s)want=other(want);}
    if(!s){s=rest[want].shift();if(!s){want=other(want);s=rest[want].shift();}if(s)lastFell=true;}
    if(!s)break;
    out.push(s.id);
    const p=S.progress[s.id]=S.progress[s.id]||{done:[],attempts:[],memo:''};
    p.introDay=t;want=other(want);
  }
  return out;
}
function ensureToday(){
  const t=todayStr();
  if(S.days[t])return S.days[t];
  const prevs=Object.keys(S.days).filter(d=>d<t).sort();
  const prev=prevs.length?S.days[prevs[prevs.length-1]]:null;
  let review=[];
  if(prev){
    review=prev.newIds.filter(id=>byId(id));
    Object.keys(S.progress).filter(id=>S.progress[id].again&&!review.includes(id)&&byId(id)).slice(0,2).forEach(id=>review.push(id));
  }
  const ll=lastNewLang();
  const start=ll?other(ll):'ja';
  const day={reviewIds:review,newIds:pickNew(S.settings.perDay,start),doneIds:[]};
  if(lastFell)day.note='선택한 주제의 문장이 부족해 다른 주제 문장이 섞였어요.';
  S.days[t]=day;save();return day;
}
function addOneNew(){
  const day=ensureToday();
  const last=day.newIds.length?byId(day.newIds[day.newIds.length-1]):null;
  const ids=pickNew(1,last?other(last.lang):(lastNewLang()?other(lastNewLang()):'ja'));
  if(!ids.length){toast('남은 새 문장이 없어요. 문장 추가 탭에서 만들 수 있어요.');return;}
  day.newIds.push(ids[0]);save();if(lastFell)toast('선택한 주제 문장이 다 떨어져 다른 주제에서 가져왔어요.');render();
}
function addMoreNew(k){
  const day=ensureToday();let n=0;
  for(let i=0;i<k;i++){
    const last=day.newIds.length?byId(day.newIds[day.newIds.length-1]):null;
    const ids=pickNew(1,last?other(last.lang):(lastNewLang()?other(lastNewLang()):'ja'));
    if(!ids.length)break;day.newIds.push(ids[0]);n++;
  }
  save();toast(n?n+'문장을 추가했어요':'남은 새 문장이 없어요. 문장 추가 탭에서 만들 수 있어요.');render();
}
function streak(){
  const set=new Set(Object.keys(S.days).filter(d=>S.days[d].doneIds&&S.days[d].doneIds.length));
  let n=0;const d=new Date();
  if(!set.has(dstr(d)))d.setDate(d.getDate()-1);
  while(set.has(dstr(d))){n++;d.setDate(d.getDate()-1);}
  return n;
}

let voices=[];
function loadVoices(){try{voices=speechSynthesis.getVoices()||[];}catch(e){voices=[];}}
if('speechSynthesis' in window){loadVoices();try{speechSynthesis.addEventListener('voiceschanged',loadVoices);}catch(e){}}
function voiceFor(lang){
  const m=voices.filter(v=>v.lang&&v.lang.toLowerCase().replace('_','-').indexOf(lang)===0);
  return m.find(v=>v.localService)||m[0]||null;
}
function speak(text,lang,rate){
  return new Promise((resolve,reject)=>{
    if(!('speechSynthesis' in window)||typeof SpeechSynthesisUtterance==='undefined'){reject(new Error('unsupported'));return;}
    try{speechSynthesis.cancel();}catch(e){}
    const u=new SpeechSynthesisUtterance(text);
    u.lang=lang==='ja'?'ja-JP':'ko-KR';
    const v=voiceFor(lang);if(v)u.voice=v;
    u.rate=rate||1;
    let settled=false,guard=null;
    const fin=(val,err)=>{if(settled)return;settled=true;clearTimeout(guard);err?reject(err):resolve(val);};
    guard=setTimeout(()=>fin(true),Math.max(4000,text.length*400/(rate||1)+3000));
    u.onend=()=>fin(true);
    u.onerror=e=>{const c=e&&e.error;(c==='canceled'||c==='interrupted')?fin(false):fin(null,new Error(c||'tts'));};
    speechSynthesis.speak(u);
  });
}

function viewToday(){
  const day=ensureToday();

  const done=ids.filter(id=>day.doneIds.includes(id)).length;

  const root=h('div',{class:'stack'});
  root.append(h('div',{class:'top'},h('div',null,h('h1',{text:'Kotoba Daily'}),h('div',{class:'sub',text:fmtDate(new Date())+' · 한일 통역 연습'}))));
  root.append(h('div',{class:'stats'},
    h('div',null,h('b',{text:done+'/'+ids.length}),h('span',{text:'오늘'})),
    h('div',null,h('b',{text:String(ids.length-done)}),h('span',{text:'남은 문제'})),
    h('div',null,h('b',{text:String(streak())}),h('span',{text:'연속 일수'}))));

const cur=()=>byId(P.id);

function makePad(){
  const coarse=window.matchMedia&&matchMedia('(pointer:coarse)').matches;
  const st={mode:coarse?'ink':'text',text:''};
  const canvas=h('canvas',{'aria-label':'손글씨 메모'});
  const ta=h('textarea',{id:'note-text','aria-label':'텍스트 메모',placeholder:'기호·숫자·고유명사를 적어 두세요',oninput:()=>{st.text=ta.value;}});
  const sheet=h('div',{class:'sheet'},canvas,ta);
  const bInk=h('button',{type:'button',text:'손글씨',onclick:()=>setMode('ink')});
  const bTxt=h('button',{type:'button',text:'키보드',onclick:()=>setMode('text')});
  const clear=h('button',{class:'link',type:'button',text:'지우기',onclick:()=>{const c=ctx();c.clearRect(0,0,canvas.width,canvas.height);ta.value='';st.text='';}});
  const el=h('div',{class:'pad'},h('div',{class:'pad-bar'},h('b',{style:'font-size:13px',text:'메모'}),h('div',{class:'seg',role:'group','aria-label':'메모 방식'},bInk,bTxt),clear),sheet);
  function ctx(){return canvas.getContext('2d');}
  function setMode(m){st.mode=m;bInk.setAttribute('aria-pressed',String(m==='ink'));bTxt.setAttribute('aria-pressed',String(m==='text'));canvas.style.display=m==='ink'?'block':'none';ta.style.display=m==='text'?'block':'none';}
  function fit(){
    const dpr=window.devicePixelRatio||1,w=Math.round(canvas.clientWidth*dpr),hh=Math.round(canvas.clientHeight*dpr);
    if(!w||!hh||(canvas.width===w&&canvas.height===hh))return;
    const tmp=document.createElement('canvas');tmp.width=canvas.width;tmp.height=canvas.height;
    if(canvas.width&&canvas.height)tmp.getContext('2d').drawImage(canvas,0,0);
    canvas.width=w;canvas.height=hh;
    if(tmp.width&&tmp.height)ctx().drawImage(tmp,0,0);
  }
  let drawing=false,lx=0,ly=0;
  function pos(e){const r=canvas.getBoundingClientRect();const dpr=canvas.width/r.width;return[(e.clientX-r.left)*dpr,(e.clientY-r.top)*dpr];}

  return{el:el,fit:fit,st:st,dispose:()=>window.removeEventListener('resize',fit)};
}

/* --- 타이머 --- */
function paintTimer(){
  if(!P||!P.el.timer)return;
  const lim=P.limit;
  let el=P.timerOn?(Date.now()-P.t0)/1000:(P.frozen!=null?P.frozen:null);
  if(el==null){P.el.tv.firstChild.textContent='--';P.el.arc.style.strokeDashoffset='0';P.el.timer.className='timer idle';return;}
  const rem=lim-el;
  P.el.tv.firstChild.textContent=rem>0?String(Math.ceil(rem)):'+'+(-rem).toFixed(1);
  P.el.arc.style.strokeDashoffset=String(CIRC*(1-Math.max(0,Math.min(1,rem/lim))));
  P.el.timer.className='timer '+(rem>5?'':(rem>0?'warn':'bad'));
  if(P.timerOn&&P.basis==='finish'&&P.recording&&rem<=0)stopRec();
}
function startTimer(){
  clearInterval(P.tick);P.t0=Date.now();P.timerOn=true;P.frozen=null;P.respSec=null;P.endSec=null;
  P.tick=setInterval(paintTimer,100);paintTimer();
}
function freezeTimer(){

}
function resetTimer(){clearInterval(P.tick);P.timerOn=false;P.frozen=null;P.t0=0;paintTimer();}

/* --- 듣기 --- */
async function playSource(rate){

  if(ok===true){startTimer();}
  else if(ok===null){
    showHint();

function setTranscript(t){P.text=t;if(P.el.text&&P.el.text.value!==t)P.el.text.value=t;updateNext();}

function startSR(){
  if(!SRC)return false;
  try{
    const r=new SRC();
    r.lang=other(cur().lang)==='ja'?'ja-JP':'ko-KR';
    r.interimResults=true;r.continuous=true;r.maxAlternatives=1;
    r.onresult=e=>{let t='';for(let i=0;i<e.results.length;i++)t+=e.results[i][0].transcript;setTranscript((P.srBase+' '+t).trim());};
    r.onerror=e=>{
      const c=e&&e.error;
      if(c==='no-speech'||c==='aborted')return;
      if(c==='not-allowed'||c==='service-not-allowed')micHelp('마이크 또는 음성 인식 권한이 꺼져 있어요. 브라우저 설정에서 허용하거나 아래 칸에 직접 입력하세요.',true);
      else if(c==='audio-capture')micHelp('마이크를 사용할 수 없어요. 설정에서 “내 목소리 녹음”을 끄면 인식이 될 수 있어요.',true);
      else if(c==='network')micHelp('음성 인식 서버에 연결하지 못했어요. 직접 입력해 주세요.',true);
      else micHelp('음성 인식에 실패했어요('+(c||'unknown')+'). 직접 입력해 주세요.',true);
    };
    r.onend=()=>{

    };

  }catch(e){return false;}
}
async function startMedia(){
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||typeof MediaRecorder==='undefined')throw new Error('unsupported');
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    if(!P||!P.recording){stream.getTracks().forEach(t=>t.stop());return false;}
    P.stream=stream;P.chunks=[];
    let mime='';
    ['audio/webm;codecs=opus','audio/mp4','audio/webm','audio/ogg'].some(m=>{try{if(MediaRecorder.isTypeSupported(m)){mime=m;return true;}}catch(e){}return false;});
    const mr=mime?new MediaRecorder(stream,{mimeType:mime}):new MediaRecorder(stream);
    mr.ondataavailable=e=>{if(e.data&&e.data.size)P&&P.chunks.push(e.data);};
    mr.onstop=()=>{
      if(!P)return;
      try{P.stream&&P.stream.getTracks().forEach(t=>t.stop());}catch(e){}

        if(P.recUrl){try{URL.revokeObjectURL(P.recUrl);}catch(e){}}

    else if(P)micHelp('녹음을 시작하지 못했어요. 아래 칸에 직접 입력해 주세요.',true);
    return false;
  }
}

async function startRec(){

/* --- 통역 차이 표시 (글자 단위 비교) --- */
function diffMarks(me,ref){
  const A=Array.from(me||''),B=Array.from(ref||'');
  const ign=c=>/[\s、。,.!?！？「」『』"'“”]/.test(c);
  const ia=[],ib=[];
  A.forEach((c,i)=>{if(!ign(c))ia.push(i);});
  B.forEach((c,i)=>{if(!ign(c))ib.push(i);});
  const n=ia.length,m=ib.length;
  if(!n||!m||n*m>60000)return null;
  const w=m+1,dp=new Uint16Array((n+1)*w);
  const eq=(i,j)=>A[ia[i]].toLowerCase()===B[ib[j]].toLowerCase();
  for(let i=1;i<=n;i++)for(let j=1;j<=m;j++){
    dp[i*w+j]=eq(i-1,j-1)?dp[(i-1)*w+j-1]+1:Math.max(dp[(i-1)*w+j],dp[i*w+j-1]);
  }
  const fa=A.map(()=>true),fb=B.map(()=>true);
  ia.forEach(i=>{fa[i]=false;});ib.forEach(i=>{fb[i]=false;});
  let i=n,j=m;
  while(i>0&&j>0){
    if(eq(i-1,j-1)){fa[ia[i-1]]=true;fb[ib[j-1]]=true;i--;j--;}

}

function finishSentence(){
  const s=cur(),t=todayStr();

  const hits=hitsFor(s,P.text);
  const r1=v=>v==null?null:Math.round(v*10)/10;
  pr.attempts.push({d:t,text:P.text,resp:r1(P.respSec),speak:r1(P.speakSec),replays:P.replays,hint:P.hint,hits:hits.ok,total:hits.total,ev:P.ev});
  pr.attempts=pr.attempts.slice(-10);
  if(!pr.done.includes(t))pr.done.push(t);
  pr.again=!!P.again;pr.lastDone=t;
  const day=ensureToday();
  if(!day.doneIds.includes(s.id))day.doneIds.push(s.id);
  save();
  const i=P.ids.indexOf(s.id);
  const order=P.ids.slice(i+1).concat(P.ids.slice(0,i));
  const nxt=order.find(id=>!day.doneIds.includes(id));
  if(nxt){startPractice(nxt);toast('저장했어요. 다음 문장입니다.');}
  else{go('today');toast('오늘 연습을 모두 마쳤어요.');}
}

  (existing.length?'- 다음 문장과 겹치지 않게: '+existing.join(' / ')+'\n':'')+SCHEMA;

const str=(v,n)=>typeof v==='string'?v.trim().slice(0,n):'';
function normItem(o){
  if(!o||typeof o!=='object')return null;
  const lang=o.lang==='ja'||o.lang==='ko'?o.lang:null;
  const src=str(o.src,200),ref=str(o.ref,300);
  if(!lang||!src||!ref)return null;
  const key=(Array.isArray(o.key)?o.key:[]).slice(0,5).map(k=>Array.isArray(k)?[str(k[0],60),str(k[1],200)]:null).filter(k=>k&&k[0]);
  const must=(Array.isArray(o.must)?o.must:[]).slice(0,6).map(m=>(Array.isArray(m)&&Array.isArray(m[1]))?[str(m[0],40),m[1].slice(0,6).map(x=>str(x,40)).filter(Boolean)]:null).filter(m=>m&&m[0]&&m[1].length);
  const gram=(Array.isArray(o.gram)?o.gram:[]).slice(0,4).map(g=>Array.isArray(g)?[str(g[0],60),str(g[1],300)]:null).filter(g=>g&&g[0]&&g[1]);
  return{id:'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),lang:lang,src:src,ref:ref,key:key,gram:gram,topic:TOPICS.includes(o.topic)?o.topic:'',nuance:str(o.nuance,400),yomi:str(o.yomi,200),must:must};
}
function parseSentences(text){
  const t=String(text||'');
  const a=t.indexOf('['),b=t.lastIndexOf(']');
  if(a<0||b<=a)throw new Error('대괄호 [ ] 로 된 JSON을 찾지 못했어요. AI의 답을 처음부터 끝까지 통째로 붙여넣었는지 확인하세요.');
  let arr;try{arr=JSON.parse(t.slice(a,b+1));}catch(e){throw new Error('JSON 형식이 올바르지 않아요. AI에게 “JSON 배열만 다시 출력해 줘”라고 요청해 보세요.');}
  if(!Array.isArray(arr))throw new Error('JSON 배열이 아니에요.');
  return arr.map(normItem).filter(Boolean);
}
function addCustom(list){
  const have=new Set(all().map(s=>s.src));const added=[];
  list.forEach(s=>{if(have.has(s.src))return;have.add(s.src);S.custom.push(s);added.push(s);});
  save();return added;
}
function addToToday(ids){
  const day=ensureToday(),t=todayStr();let n=0;
  ids.forEach(id=>{
    if(!byId(id)||day.newIds.includes(id)||day.reviewIds.includes(id))return;
    day.newIds.push(id);
    const p=S.progress[id]=S.progress[id]||{done:[],attempts:[],memo:''};
    p.introDay=p.introDay||t;n++;
  });
  save();return n;
}
function removeCustom(id){
  S.custom=S.custom.filter(s=>s.id!==id);
  delete S.progress[id];
  Object.keys(S.days).forEach(d=>{const x=S.days[d];['reviewIds','newIds','doneIds'].forEach(k=>{x[k]=(x[k]||[]).filter(i=>i!==id);});});

}
async function viaSample(prompt){
  if(!(window.claude&&window.claude.use))return null;
  const sm=await window.claude.use('sample');
  if(!sm)return null;
  const r=await sm(prompt,{cache:false});
  return r&&r.text;
}
async function viaEndpoint(prompt,extra){
  const url=S.settings.endpoint;if(!url)return null;
  const headers={'Content-Type':'application/json'};
  if(S.settings.token)headers.Authorization='Bearer '+S.settings.token;
  let r;
  try{r=await fetch(url,{method:'POST',headers:headers,body:JSON.stringify(Object.assign({prompt:prompt},extra||{}))});}
  catch(e){throw new Error('AI 서버에 연결하지 못했어요. 서버 주소와 허용 도메인(ALLOWED_ORIGIN) 설정을 확인하세요.');}
  const t=await r.text();
  if(!r.ok){
    if(r.status===401)throw new Error('서버 비밀번호가 맞지 않아요. 설정에서 다시 확인하세요.');
    if(r.status===403)throw new Error('이 사이트 주소가 서버의 허용 도메인에 없어요 (ALLOWED_ORIGIN).');
    throw new Error('AI 서버 오류 ('+r.status+') '+t.slice(0,140));
  }
  return t;
}
async function viaOpenAI(prompt){
  const k=S.settings.oaKey,m=S.settings.oaModel;
  if(!k||!m)return null;
  let r;
  try{r=await fetch('https://api.openai.com/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+k},body:JSON.stringify({model:m,messages:[{role:'user',content:prompt}]})});}
  catch(e){throw new Error('OpenAI에 연결하지 못했어요. 인터넷 연결을 확인하세요.');}
  const d=await r.json().catch(()=>null);
  if(!r.ok){
    const msg=d&&d.error&&d.error.message?String(d.error.message).slice(0,140):'';
    if(r.status===401)throw new Error('API 키가 맞지 않아요. 설정에서 키를 다시 확인하세요.');
    if(r.status===429)throw new Error('사용 한도나 크레딧이 부족해요. OpenAI 결제(Billing) 상태를 확인하세요.');
    if(r.status===404||r.status===400)throw new Error('모델 이름을 확인하세요. '+msg);
    throw new Error('OpenAI 오류 ('+r.status+') '+msg);
  }
  const c=d&&d.choices&&d.choices[0]&&d.choices[0].message;
  return (c&&c.content)||'';
}
async function askAI(prompt,extra){
  let t=await viaSample(prompt);
  if(t==null)t=await viaEndpoint(prompt,extra);
  if(t==null)t=await viaOpenAI(prompt);
  return t;
}

  if(window.claude&&window.claude.use){try{Promise.resolve(window.claude.use('sample')).then(sm=>{if(sm)cb();}).catch(()=>{});}catch(e){}}
}
